<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Browser-based API simulator. Not a backend server.">
    <script>
      (function () {
        var theme = "dark";
        try {
          var saved = JSON.parse(localStorage.getItem("mockApiStudio:settings:v1")).theme;
          if (saved === "light" || saved === "dark") theme = saved;
          else if (matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (error) {
          if (matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>Mock API Studio</title>
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/responsive.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app">
      <header class="topbar">
        <div>
          <p class="brand">Mock API Studio</p>
          <p class="tagline">Browser-based API simulator. Not a backend server.</p>
        </div>
        <div class="top-actions">
          <button id="theme-toggle" type="button" aria-label="Dark theme">Dark</button>
          <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
        </div>
      </header>
      <div class="shell">
        <nav id="site-nav" aria-label="Main">
          <a href="#/dashboard">Dashboard</a>
          <a href="#/endpoints">Endpoints</a>
          <a href="#/tester">Tester</a>
          <a href="#/collections">Collections</a>
          <a href="#/logs">Logs</a>
          <a href="#/docs">Docs</a>
        </nav>
        <main id="main" tabindex="-1"></main>
      </div>
      <footer class="site-footer">
        <p>Copyright (c) 2026 farizsidki</p>
      </footer>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
